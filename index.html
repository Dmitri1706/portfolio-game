<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#010103" />
    <title>Дмитрий Мельшин — Портфолио</title>
    <meta name="description" content="Дмитрий Мельшин — %ROLE%. Интерактивное портфолио: ходите по комнатам и смотрите кейсы." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="%SITE_URL%" />
    <meta property="og:title" content="Дмитрий Мельшин — Портфолио" />
    <meta property="og:description" content="Дмитрий Мельшин — %ROLE%. Интерактивное портфолио" />
    <meta property="og:image" content="%SITE_URL%og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" type="image/png" sizes="32x32" href="./favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="./favicon-16.png" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <style>
      /* Экран загрузки: стили здесь, чтобы он появился сразу, до загрузки игры */
      html, body { margin: 0; height: 100%; background: #010103; }
      #loader {
        position: fixed; inset: 0; z-index: 100;
        display: flex; align-items: center; justify-content: center;
        background: radial-gradient(ellipse at 50% 45%, #2a1f1a 0%, #0b0809 60%, #010103 100%); color: #fffaf0; text-align: center;
        font-family: 'Press Start 2P', monospace;
        transition: opacity 0.4s steps(4);
      }
      #loader.is-hidden { opacity: 0; pointer-events: none; }
      .loader__inner { width: min(640px, calc(100% - 32px)); }
      .loader__phrase { font-size: 16px; line-height: 24px; margin: 0 0 112px; color: #ffe7a3; }
      .loader__bar {
        position: relative; height: 24px; margin: 0 0 48px;
        border: 4px solid #fffaf0; box-sizing: border-box; background: #1d1828;
      }
      .loader__fill {
        position: absolute; left: 0; top: 0; bottom: 0; width: 0;
        background: repeating-linear-gradient(90deg, #ffc94a 0 12px, #f08a24 12px 16px);
      }
      .loader__runner {
        position: absolute; bottom: 6px; left: 0; width: 80px; height: 136px;
        margin-left: -40px; background-repeat: no-repeat;
        background-size: 640px 544px; background-position: 0 0;
        animation: loader-run 0.66s steps(8) infinite;
      }
      @keyframes loader-run { from { background-position-x: 0; } to { background-position-x: -640px; } }
      .loader__name { font-size: 32px; line-height: 40px; margin: 0 0 16px; font-weight: normal; }
      .loader__role { font-size: 16px; line-height: 24px; margin: 0; color: #c8e7ff; }
      @media (max-width: 700px), (max-height: 480px) {
        .loader__phrase { font-size: 8px; line-height: 16px; margin-bottom: 80px; }
        .loader__bar { height: 20px; margin-bottom: 24px; }
        .loader__runner { width: 50px; height: 85px; margin-left: -25px; bottom: 4px;
          background-size: 400px 340px; background-position: 0 0; animation-name: loader-run-s; }
        .loader__name { font-size: 16px; line-height: 24px; margin-bottom: 8px; }
        .loader__role { font-size: 8px; line-height: 16px; }
      }
      @keyframes loader-run-s { from { background-position-x: 0; } to { background-position-x: -400px; } }
    </style>
  </head>
  <body>
    <div id="loader" role="status" aria-live="polite">
      <div class="loader__inner">
        <p class="loader__phrase">Считаю конверсию вашего визита… <span id="loader-pct">0</span>%</p>
        <div class="loader__bar">
          <div class="loader__fill" id="loader-fill"></div>
          <div class="loader__runner" id="loader-runner"></div>
        </div>
        <h1 class="loader__name">Дмитрий Мельшин</h1>
        <p class="loader__role">%ROLE%</p>
      </div>
    </div>
    <div id="game"></div>
    <!-- HTML-слой поверх игры: окна, диалоги, кнопки -->
    <div id="ui"></div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
